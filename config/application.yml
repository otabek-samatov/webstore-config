eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
           
management:
  endpoints:
    web:
      exposure:
        include: "*"
        
spring:  
  datasource:
    url: jdbc:postgresql://localhost:5432/webstore?currentSchema=${service.schemaName}
    # Credentials are NOT stored in this repo. Each service resolves these
    # placeholders from its own environment at startup (values must match
    # the Docker secrets in webstore/secrets/).
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
        

bootstrap:
  servers: localhost:9092  # Kafka broker address(es)

num:
  partitions: 3  # number of partitions for the topic

replication:
  factor: 1
  
topic:
  stock:
    status: stock-status-event 
  order:
    status: order-status-event
  payment:
    status: payment-status-event