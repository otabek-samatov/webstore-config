eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
           
management:
  endpoints:
    web:
      exposure:
        include: "*"
        
spring:  
  datasource:
    # Connection coordinates are property-driven with local-dev defaults.
    # Override per environment via DB_HOST / DB_PORT / DB_NAME env vars
    # (relaxed binding: db.host -> DB_HOST), a per-service <name>.yml, or
    # config-tree files — e.g. in Docker set DB_HOST=postgres.
    url: jdbc:postgresql://${db.host:localhost}:${db.port:5432}/${db.name:webstore}?currentSchema=${service.schemaName}
    # Credentials are NOT stored in this repo. Resolved at service startup:
    # in a container, from Docker secret files via the configtree import of
    # /run/secrets/ (files db_username / db_password); on a host, from the
    # DB_USERNAME / DB_PASSWORD environment variables (relaxed binding maps
    # db_username -> DB_USERNAME automatically).
    username: ${db_username}
    password: ${db_password}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
        

bootstrap:
  servers: localhost:9092  # Kafka broker address(es)

num:
  partitions: 3  # number of partitions for the topic

replication:
  factor: 1
  
topic:
  stock:
    status: stock-status-event 
  order:
    status: order-status-event
  payment:
    status: payment-status-event