server:
  # Host runs fall back to the default; Docker passes SERVICE_PORT (mapped from
  # GATEWAY_SERVICE_PORT in webstore/.env by docker-compose.yml).
  port: ${SERVICE_PORT:8072}
spring:
  cloud:
    gateway:
      # Route targets are direct URLs (no service discovery). Defaults suit
      # host runs; containers override via the *_SERVICE_URL env vars set in
      # docker-compose.yml (Compose DNS name + fixed port).
      routes:
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8074}
          predicates:
            - Path=/inventory/**
          filters:
            - RewritePath=/inventory/(?<path>.*), /$\{path}
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8077}
          predicates:
            - Path=/order/**
          filters:
            - RewritePath=/order/(?<path>.*), /$\{path}
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8078}
          predicates:
            - Path=/payment/**
          filters:
            - RewritePath=/payment/(?<path>.*), /$\{path}
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8073}
          predicates:
            - Path=/product/**
          filters:
            - RewritePath=/product/(?<path>.*), /$\{path}
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8075}
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user/(?<path>.*), /$\{path}
