# =============================================================================
# Shared PROD overrides — merged on top of application.yml for every service
# when SPRING_PROFILES_ACTIVE=prod.
#
# PROD locks things down: minimal actuator surface, no SQL body logging,
# multi-broker Kafka sizing. Put only PROD-specific deltas here.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # Only the endpoints probes/monitoring need — no env/beans/mappings/etc.
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never

spring:
  jpa:
    properties:
      hibernate:
        # Don't pretty-print SQL in prod; keep logs lean.
        format_sql: false

logging:
  level:
    # Suppress per-statement SQL logging in prod.
    org.hibernate.SQL: warn

# Sized for a 3-broker PROD Kafka. replication.factor must be <= broker count.
num:
  partitions: 6
replication:
  factor: 3
