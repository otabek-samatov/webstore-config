# =============================================================================
# Shared DEV overrides — merged on top of application.yml for every service
# when SPRING_PROFILES_ACTIVE=dev.
#
# DEV mirrors the base defaults: verbose SQL logging, all actuator endpoints
# exposed, single-broker Kafka sizing. Put only DEV-specific deltas here.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

# Single-node local Kafka.
num:
  partitions: 3
replication:
  factor: 1
