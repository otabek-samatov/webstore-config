server:
  # Host runs fall back to the default; Docker passes SERVICE_PORT (mapped from
  # PAYMENT_SERVICE_PORT in webstore/.env by docker-compose.yml).
  port: ${SERVICE_PORT:8078}
 
service:
  schemaName: payment_schema

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must equal the `iss` claim in the token EXACTLY, or every request 401s.
          # auth-service currently derives its issuer from the request host, so this
          # default only lines up for host runs (token minted via localhost:8076).
          # Pin AuthorizationServerSettings on auth-service before setting this to a
          # container or gateway URL.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8076}
